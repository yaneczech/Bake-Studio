[package]
name = "bake-studio"
version = "0.1.0"
description = "Bake Studio desktop shell"
authors = ["Jan Janecek"]
edition = "2021"

[lib]
name = "bake_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.5", features = [] }

